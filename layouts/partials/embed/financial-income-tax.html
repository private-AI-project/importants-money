    <form id="financial-income-form" class="calc-form">
      <div class="calc-field">
        <label for="financial">연간 이자·배당소득 <span>(원)</span></label>
        <input type="text" id="financial" name="financial" inputmode="numeric" placeholder="예: 25000000" required>
        <p class="calc-hint">세전 금액입니다. ISA나 비과세 종합저축처럼 비과세·분리과세로 끝나는 상품은 빼고 넣으세요.</p>
      </div>

      <div class="calc-field">
        <label for="other">그 밖의 종합소득금액 <span>(원)</span></label>
        <input type="text" id="other" name="other" inputmode="numeric" placeholder="없으면 비워두세요">
        <p class="calc-hint">근로소득금액, 사업소득금액, 연금소득금액 등을 더한 값입니다. 총급여가 아니라 근로소득공제를 뺀 <strong>소득금액</strong>입니다. 여기가 클수록 금융소득에 붙는 세율도 올라갑니다.</p>
      </div>

      <div class="calc-field">
        <label for="deduct">소득공제 합계 <span>(원, 선택)</span></label>
        <input type="text" id="deduct" name="deduct" inputmode="numeric" placeholder="모르시면 비워두세요">
        <p class="calc-hint">인적공제, 연금보험료공제 등입니다. 비워두면 본인 기본공제 150만원만 잡습니다.</p>
      </div>

      <div class="calc-field">
        <label for="insured">건강보험 가입 유형</label>
        <select id="insured" name="insured">
          <option value="employee">직장가입자</option>
          <option value="local">지역가입자</option>
          <option value="dependent">피부양자</option>
        </select>
        <p class="calc-hint">유형마다 문턱이 다릅니다. 지역가입자는 1,000만원, 피부양자와 직장가입자는 2,000만원입니다.</p>
      </div>

      <button type="submit" class="calc-submit">세금과 건강보험 영향 보기</button>
    </form>

    <div id="calc-result" class="calc-result" hidden></div>
